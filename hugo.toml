baseURL = "https://www.pirogue2000.fr/"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "Pirogue 2000"
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true
removePathAccents = false

[[module.mounts]]
  source = "static/images"
  target = "assets/images"

[params]
  description = "Association humanitaire au Niger, basée à Saint Jean Le Blanc : santé, éducation et autosuffisance alimentaire."
  facebook = "https://www.facebook.com/Pirogue-2000-169613653654704/"

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.renderHooks.image]
  useEmbedded = "never"

[markup.goldmark.renderHooks.link]
  useEmbedded = "never"

