name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install pinned Hugo
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .hugo-version)"
          archive="hugo_${version}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${version}/${archive}"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/checksums.txt" \
            "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_${version}_checksums.txt"
          cd "$RUNNER_TEMP"
          grep " ${archive}$" checksums.txt | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --cleanDestinationDir --panicOnWarning --baseURL "$HUGO_BASEURL"
      - name: Check generated site
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/check_site.py --base-url "$HUGO_BASEURL"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
